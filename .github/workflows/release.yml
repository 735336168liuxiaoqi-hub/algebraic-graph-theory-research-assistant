name: Prepare or publish a reviewed release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag matching graph_research/_version.py
        required: true
      publish:
        description: Publish the reviewed release after the rights/license check passes
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-dev.txt
      - name: Use long-form temporary paths
        shell: pwsh
        run: |
          "TEMP=$env:USERPROFILE\AppData\Local\Temp" >> $env:GITHUB_ENV
          "TMP=$env:USERPROFILE\AppData\Local\Temp" >> $env:GITHUB_ENV
      - name: Install locked dependencies and source
        shell: pwsh
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -r requirements-lock.txt -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed" }
          .venv/Scripts/python.exe -m pip install --no-deps --no-build-isolation -e .
          if ($LASTEXITCODE -ne 0) { throw "Project installation failed" }
      - name: Match requested tag to this source
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          .venv/Scripts/python.exe -c "import os,graph_research; from packaging.version import Version; v=graph_research.__version__; assert os.environ['REQUESTED_TAG']=='v'+v, 'Tag does not match package version'; print('prerelease='+str(Version(v).is_prerelease).lower())" >> $env:GITHUB_OUTPUT
      - name: Reject public publication without confirmed rights
        if: ${{ inputs.publish }}
        run: .venv/Scripts/python.exe tools/check_public_release.py
      - name: Full checks
        run: .venv/Scripts/python.exe -X utf8 tools/checks.py --full --strict-lock --report-dir outputs/release-acceptance
      - name: Build and independently verify wheel
        shell: pwsh
        run: |
          .venv/Scripts/python.exe -X utf8 tools/build_release.py
          if ($LASTEXITCODE -ne 0) { throw "Wheel build failed" }
          .venv/Scripts/python.exe -X utf8 tools/verify_release.py
          if ($LASTEXITCODE -ne 0) { throw "Independent wheel verification failed" }
      - name: Export clean source candidate
        run: .venv/Scripts/python.exe -X utf8 tools/prepare_public_release.py --output dist/source-candidate
      - name: Assemble release attachments
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $candidate = Get-Content dist/source-candidate/candidate.json -Raw | ConvertFrom-Json
          $summary = Get-Content outputs/release-acceptance/checks-summary.json -Raw | ConvertFrom-Json
          if ($summary.status -ne 'passed' -or $candidate.version -ne $version) { throw 'Release checks incomplete' }
          @{
            version = $version
            source_commit = $env:GITHUB_SHA
            workflow_run_id = $env:GITHUB_RUN_ID
            checks = @('Windows CI: tools/checks.py --full --strict-lock passed', 'Built and independently verified wheel', 'Exported and verified clean source candidate')
            limitations = @('CI results apply to this runner and commit; they do not certify clean end-user installations or external model services.')
          } | ConvertTo-Json | Set-Content -Encoding utf8 dist/ci-evidence.json
          .venv/Scripts/python.exe -X utf8 tools/assemble_release_assets.py --source $candidate.source_archive --wheel "dist/graph_research_assistant-$version-py3-none-any.whl" --evidence dist/ci-evidence.json --output dist/release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/release-assets/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-checks
          path: outputs/release-acceptance/

  publish:
    if: ${{ inputs.publish }}
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-artifacts
      - name: Create the requested release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          TARGET_COMMIT: ${{ github.sha }}
          IS_PRERELEASE: ${{ needs.build.outputs.prerelease }}
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem -LiteralPath release-artifacts -File)
          if ($assets.Count -ne 7) { throw "Expected exactly seven assembled attachments" }
          $assetPaths = @($assets | ForEach-Object FullName)
          $releaseArgs = @('release', 'create', $env:RELEASE_TAG, '--target', $env:TARGET_COMMIT, '--title', "Algebraic Graph Theory Research Assistant $env:RELEASE_TAG", '--generate-notes')
          if ($env:IS_PRERELEASE -eq 'true') { $releaseArgs += '--prerelease' }
          & gh @releaseArgs @assetPaths
          if ($LASTEXITCODE -ne 0) { throw "GitHub release creation failed" }
