[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-research-assistant"
dynamic = ["version"]
description = "Algebraic Graph Theory Research Assistant: graph and hypergraph spectra, symbolic computation and visualization"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE.md"]
readme = "README.md"
dependencies = ["numpy>=1.26,<3", "networkx>=3.2,<4", "sympy>=1.14,<2"]

[project.urls]
Homepage = "https://github.com/735336168liuxiaoqi-hub/algebraic-graph-theory-research-assistant"
Repository = "https://github.com/735336168liuxiaoqi-hub/algebraic-graph-theory-research-assistant"
Issues = "https://github.com/735336168liuxiaoqi-hub/algebraic-graph-theory-research-assistant/issues"

[project.optional-dependencies]
visual = ["matplotlib>=3.8,<4"]
tools = ["jsonschema>=4.20,<5"]
mcp = ["mcp>=2.3,<3", "jsonschema>=4.20,<5"]
assistant = ["langgraph>=1,<2", "httpx>=0.27,<1", "jsonschema>=4.20,<5"]
search = ["torch>=2.6,<3", "jsonschema>=4.20,<5"]
desktop = ["PySide6>=6.5,<7", "matplotlib>=3.8,<4", "jsonschema>=4.20,<5", "langgraph>=1,<2", "httpx>=0.27,<1"]
all = ["matplotlib>=3.8,<4", "langgraph>=1,<2", "httpx>=0.27,<1", "jsonschema>=4.20,<5", "PySide6>=6.5,<7", "mcp>=2.3,<3"]

[project.scripts]
graph-research = "graph_research.cli:main"

[project.gui-scripts]
graph-research-desktop = "graph_research.desktop:gui_main"

[tool.setuptools.packages.find]
include = ["graph_research*"]

[tool.setuptools.dynamic]
version = {attr = "graph_research._version.__version__"}

[tool.ruff]
target-version = "py311"
extend-exclude = ["outputs", "tmp", "dist", "build", ".venv"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.setuptools.package-data]
graph_research = ["data/*.json", "assets/*.html", "_integrity.json"]
