<line x1="60" x2="1060" y1="1485" y2="1485" stroke="#e3e9ec"/>
<text x="60" y="1511" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#647481">已有工具联动不创建新包；扩展不能覆盖原生工具或授予自身审批权。</text>
<text x="60" y="1535" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#647481">记忆仅提供偏好和经验参考，不替用户批准开发，也不训练模型权重。</text>
