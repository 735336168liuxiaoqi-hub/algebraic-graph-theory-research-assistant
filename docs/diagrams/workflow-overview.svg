<text x="560" y="468.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#224d64">校验工具契约、图类型及数学前提</text>
<rect x="190" y="550" width="740" height="80" rx="14" fill="#e9f3f7" stroke="#8fb1c3" stroke-width="1.5"/>
<text x="560" y="576.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600" fill="#224d64">受保护的本地执行</text>
<text x="560" y="603.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#224d64">预算、完整性、资源限制、取消及执行回执</text>
