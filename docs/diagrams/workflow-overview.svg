<text x="560" y="711.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600" fill="#2b574a">保留结果与执行证据</text>
<text x="560" y="738.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#2b574a">数值、图对象、坐标、逐步状态与验证信息</text>
<rect x="190" y="820" width="740" height="80" rx="14" fill="#f0f6f4" stroke="#adc7bc" stroke-width="1.5"/>
<text x="560" y="846.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600" fill="#2b574a">查看、导出与继续研究</text>
<text x="560" y="873.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#2b574a">表格、结构图、PNG / SVG / PDF、TikZ / TeX</text>
<rect x="190" y="955" width="740" height="80" rx="14" fill="#f0f6f4" stroke="#adc7bc" stroke-width="1.5"/>
<text x="560" y="981.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600" fill="#2b574a">成果中心与结果包</text>
<text x="560" y="1008.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#2b574a">保存当前任务 / 对话的记录、数据和附件</text>
<line x1="60" x2="1060" y1="1095" y2="1095" stroke="#e3e9ec"/>
<text x="60" y="1121" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#647481">可选记忆：按用户读取偏好与已审阅经验；当前请求优先。</text>
<text x="60" y="1145" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#647481">计算记录可形成经验候选，经用户审阅后才用于后续参考。</text>
