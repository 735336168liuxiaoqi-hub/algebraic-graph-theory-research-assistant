<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1490" viewBox="0 0 1120 1490" role="img" aria-labelledby="title desc">
<title id="title">MCP 委派 · 主agent如何调用科研助手</title>
<desc id="desc">默认只执行已有工具；无需单独配置科研助手的模型API</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a9aa6"/></marker></defs>
<rect width="1120" height="1490" rx="16" fill="#ffffff"/>
<rect x="44" y="35" width="5" height="31" rx="2" fill="#167467"/>
<text x="67" y="51" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="600" fill="#1b3440">MCP 委派 · 主agent如何调用科研助手</text>
<text x="67" y="86" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#647481">默认只执行已有工具；无需单独配置科研助手的模型API</text>
<path d="M 560 178 L 560 227" fill="none" stroke="#8a9aa6" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 560 303 L 560 357" fill="none" stroke="#8a9aa6" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 310 400 L 295 400 L 295 335 L 170 335 L 170 357" fill="none" stroke="#8a9aa6" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 560 443 L 560 502" fill="none" stroke="#8a9aa6" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 60 400 L 50 400 L 50 695 L 310 695" fill="none" stroke="#8a9aa6" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 310 545 L 300 545 L 300 480 L 170 480 L 170 502" fill="none" stroke="#8a9aa6" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 60 545 L 35 545 L 35 1010 L 310 1010" fill="none" stroke="#8a9aa6" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 560 588 L 560 657" fill="none" stroke="#8a9aa6" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 560 733 L 560 785" fill="none" stroke="#8a9aa6" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 410 835 L 280 835" fill="none" stroke="#8a9aa6" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 170 792 L 195 755 L 290 755 L 310 695" fill="none" stroke="#8a9aa6" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 710 835 L 835 835" fill="none" stroke="#8a9aa6" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 950 878 L 950 955" fill="none" stroke="#8a9aa6" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 950 1055 L 950 1132" fill="none" stroke="#8a9aa6" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1065 1175 L 1090 1175 L 1090 545 L 810 545" fill="none" stroke="#8a9aa6" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 560 885 L 560 967" fill="none" stroke="#8a9aa6" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 560 1053 L 560 1120" fill="none" stroke="#8a9aa6" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 560 1230 L 560 1282" fill="none" stroke="#8a9aa6" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="310" y="102" width="500" height="76" rx="14" fill="#f0edfa" stroke="#b5a7da" stroke-width="1.5"/>
<text x="560" y="126.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600" fill="#5b438c">主agent理解用户任务</text>
<text x="560" y="153.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#5b438c">自然语言规划使用主agent自己的模型</text>
<rect x="310" y="227" width="500" height="76" rx="14" fill="#f0edfa" stroke="#b5a7da" stroke-width="1.5"/>
<text x="560" y="251.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600" fill="#5b438c">research_catalog</text>
<text x="560" y="278.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#5b438c">发现工具、读取契约与版本指纹</text>
<rect x="310" y="357" width="500" height="86" rx="14" fill="#f0edfa" stroke="#b5a7da" stroke-width="1.5"/>
<text x="560" y="386.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600" fill="#5b438c">research_submit</text>
<text x="560" y="413.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#5b438c">提交固定步骤 / 扫描 / 批量任务</text>
<rect x="60" y="357" width="220" height="86" rx="14" fill="#f0f6f4" stroke="#adc7bc" stroke-width="1.5"/>
<text x="170" y="386.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="600" fill="#2b574a">相同编号与相同输入</text>
<text x="170" y="413.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#2b574a">返回原任务，不新增计算</text>
<rect x="310" y="502" width="500" height="86" rx="14" fill="#e9f3f7" stroke="#8fb1c3" stroke-width="1.5"/>
<text x="560" y="531.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600" fill="#224d64">后台受保护计算</text>
<text x="560" y="558.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#224d64">快速返回task_id，保存预算与逐步记录</text>
<rect x="60" y="502" width="220" height="86" rx="14" fill="#fcf4e7" stroke="#d7b985" stroke-width="1.5"/>
<text x="170" y="531.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="600" fill="#805b26">research_cancel</text>
<text x="170" y="558.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#805b26">请求停止，保留已有记录</text>
<rect x="310" y="657" width="500" height="76" rx="14" fill="#f0edfa" stroke="#b5a7da" stroke-width="1.5"/>
<text x="560" y="681.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600" fill="#5b438c">research_get</text>
<text x="560" y="708.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#5b438c">按原task_id查询，不重复创建任务</text>
<path d="M 560 785 L 710 835 L 560 885 L 410 835 Z" fill="#ffffff" stroke="#9fadb9" stroke-width="1.5"/>
<text x="560" y="835.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600" fill="#344c5c">当前任务状态？</text>
<rect x="60" y="792" width="220" height="86" rx="14" fill="#f0f6f4" stroke="#adc7bc" stroke-width="1.5"/>
<text x="170" y="821.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="600" fill="#2b574a">仍在运行</text>
<text x="170" y="848.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#2b574a">短暂等待后再查询</text>
<rect x="835" y="792" width="230" height="86" rx="14" fill="#eaf5f1" stroke="#8dbbb0" stroke-width="1.5"/>
<text x="950" y="821.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="600" fill="#175a4a">等待用户回复或审批</text>
<text x="950" y="848.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#175a4a">主agent完整转交interaction</text>
<rect x="835" y="955" width="230" height="100" rx="14" fill="#eaf5f1" stroke="#8dbbb0" stroke-width="1.5"/>
<text x="950" y="991.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="600" fill="#175a4a">可信用户入口</text>
<text x="950" y="1018.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#175a4a">用户操作后签发event_id</text>
<rect x="835" y="1132" width="230" height="86" rx="14" fill="#f0edfa" stroke="#b5a7da" stroke-width="1.5"/>
<text x="950" y="1161.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="600" fill="#5b438c">research_resume</text>
<text x="950" y="1188.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#5b438c">只转交已签发的event_id</text>
<rect x="310" y="967" width="500" height="86" rx="14" fill="#f0f6f4" stroke="#adc7bc" stroke-width="1.5"/>
<text x="560" y="996.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600" fill="#2b574a">完成、失败或已取消</text>
<text x="560" y="1023.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#2b574a">保留实际结果和未完成部分</text>
<rect x="310" y="1120" width="500" height="110" rx="14" fill="#f0edfa" stroke="#b5a7da" stroke-width="1.5"/>
<text x="560" y="1148.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600" fill="#5b438c">按需读取结果与已登记附件</text>
<text x="560" y="1175.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#5b438c">research_inspect_result</text>
<text x="560" y="1202.0" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#5b438c">research_read_artifact</text>
<rect x="310" y="1282" width="500" height="86" rx="14" fill="#f0edfa" stroke="#b5a7da" stroke-width="1.5"/>
<text x="560" y="1311.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600" fill="#5b438c">主agent整理并交付给用户</text>
<text x="560" y="1338.5" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#5b438c">数据、图形、TeX或结果包</text>
<rect x="131" y="303" width="78" height="24" rx="5" fill="#ffffff"/>
<text x="170" y="315" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#526575">已有任务</text>
<rect x="586" y="464" width="62" height="24" rx="5" fill="#ffffff"/>
<text x="617" y="476" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#526575">新任务</text>
<rect x="131" y="468" width="78" height="24" rx="5" fill="#ffffff"/>
<text x="170" y="480" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#526575">用户停止</text>
<rect x="329" y="803" width="62" height="24" rx="5" fill="#ffffff"/>
<text x="360" y="815" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#526575">运行中</text>
<rect x="728" y="798" width="94" height="24" rx="5" fill="#ffffff"/>
<text x="775" y="810" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#526575">需用户操作</text>
<rect x="969" y="653" width="126" height="24" rx="5" fill="#ffffff"/>
<text x="1032" y="665" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#526575">核验事件后继续</text>
<rect x="583.5" y="918" width="101" height="24" rx="5" fill="#ffffff"/>
<text x="634" y="930" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#526575">已停止/结束</text>
<line x1="60" x2="1060" y1="1386" y2="1386" stroke="#e3e9ec"/>
<text x="60" y="1412" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#647481">status是任务状态；operation.status/error说明最近后台操作是否成功。</text>
<text x="60" y="1436" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#647481">取消后继续需用户真实操作；相同request_id的输入必须一致。</text>
<text x="60" y="1460" text-anchor="start" dominant-baseline="central" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#647481">等待交互按宿主启用能力使用；新工具开发审批走独立流程。</text>
</svg>
